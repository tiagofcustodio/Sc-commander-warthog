name: Auto-Build SC_Warthog_Commander.exe

on:
  push:
    branches:
      - main
    paths:
      - 'sc_warthog_commander/**'
      - 'SC_Warthog_Commander.spec'
      - '!sc_warthog_commander/config.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]') && github.actor != 'github-actions[bot]'"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn websockets pillow numpy psutil pywin32 pyinstaller

      - name: Build standalone SC_Warthog_Commander.exe
        run: |
          python -m PyInstaller --clean --noconfirm SC_Warthog_Commander.spec

      - name: Commit updated .exe to main for automatic client self-updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/SC_Warthog_Commander.exe
          git diff --cached --quiet && echo "No changes to exe" || (git commit -m "chore: auto-build SC_Warthog_Commander.exe [skip ci]" && git push)
